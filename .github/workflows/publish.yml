name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: npm trusts this repo's publish.yml through GitHub's OIDC
      # token, so there's no npm token secret to expire or to need a 2FA bypass.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Publish
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if [[ "$VERSION" == *-* ]]; then TAG=beta; else TAG=latest; fi
          npm publish --provenance --access public --tag "$TAG"
